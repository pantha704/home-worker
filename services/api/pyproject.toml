[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "homeworker-api"
version = "0.2.1"
description = "Local-first document extraction, review, and A4 handwriting PDF API"
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = { text = "AGPL-3.0-only" }
dependencies = [
  "fastapi==0.161.1",
  "uvicorn[standard]==0.54.0",
  "pydantic==2.14.1",
  "python-multipart==0.0.32",
  "SQLAlchemy==2.1.6",
  "httpx==0.28.1",
  "PyJWT[crypto]==2.15.1",
  "psycopg[binary]==3.3.6",
  "PyMuPDF==2.0",
  "Pillow==13.0.0",
  "pytesseract==0.3.13",
  "reportlab==5.1.0",
]

[project.optional-dependencies]
dev = [
  "mypy==2.4.0",
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
  "ruff==0.17.2",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["tests"]

[[tool.mypy.overrides]]
module = ["fitz", "pytesseract", "reportlab.*"]
ignore_missing_imports = true
