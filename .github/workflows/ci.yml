name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  FORCE_COLOR: "1"

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: services/api
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: 3.14.6

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: 0.11.28
          enable-cache: true
          cache-dependency-glob: services/api/uv.lock

      - name: Install locked dependencies
        run: uv sync --frozen --extra dev

      - name: Check formatting
        run: uv run ruff format --check app tests

      - name: Lint
        run: uv run ruff check app tests

      - name: Type-check
        run: uv run mypy app

      - name: Test
        run: uv run pytest

  release-audit:
    name: Release audit
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Test release verifier
        run: python -m unittest scripts.test_verify_release -v

      - name: Audit tracked release files
        run: python scripts/verify_release.py

      - name: Build and inspect source archive
        run: |
          scripts/package-release.sh /tmp/Homeworker-v0.2.0.zip
          python - <<'PY'
          from pathlib import Path
          import zipfile

          archive = Path("/tmp/Homeworker-v0.2.0.zip")
          with zipfile.ZipFile(archive) as release:
              names = set(release.namelist())
          assert "Homeworker/README.md" in names
          assert "Homeworker/.homeworker-goals.md" not in names
          assert "Homeworker/.homeworker-issues.md" not in names
          assert not any("/data/work/" in name for name in names)
          PY

  frontend:
    name: Frontend and contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.0.10
        with:
          version: 11.18.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24.18.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm typecheck

      - name: Test contracts and UI
        run: pnpm test

      - name: Production build
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
        run: pnpm build

      - name: Hosted static build
        env:
          NEXT_PUBLIC_RUNTIME_MODE: hosted
          NEXT_PUBLIC_API_BASE_URL: https://homeworker-api.example.com
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
        run: pnpm --filter @homeworker/web build:hosted

      - name: Install Chromium and Firefox for end-to-end tests
        run: pnpm --dir apps/web exec playwright install --with-deps chromium firefox

      - name: Run browser smoke test
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
        run: pnpm --dir apps/web test:e2e

  compose-smoke:
    name: Container smoke test
    needs:
      - backend
      - frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Validate Compose model
        run: docker compose -f infra/compose.yaml config --quiet

      - name: Build local images
        run: docker compose -f infra/compose.yaml build

      - name: Verify non-root image users
        run: |
          test "$(docker image inspect --format '{{.Config.User}}' homeworker-api:local)" = "10001:10001"
          test "$(docker image inspect --format '{{.Config.User}}' homeworker-web:local)" = "10001:10001"

      - name: Start and wait for health
        run: docker compose -f infra/compose.yaml up -d --wait --wait-timeout 120

      - name: Smoke liveness, readiness, and UI
        run: |
          docker compose -f infra/compose.yaml exec -T api python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).read(); urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=5).read()"
          docker compose -f infra/compose.yaml exec -T web node -e "fetch('http://127.0.0.1:3000/').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"

      - name: Show service logs after failure
        if: failure()
        run: docker compose -f infra/compose.yaml logs --no-color --tail=200

      - name: Stop stack
        if: always()
        run: docker compose -f infra/compose.yaml down --remove-orphans
