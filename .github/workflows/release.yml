name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Verify and publish source release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7.0.0
        with:
          persist-credentials: false

      - name: Test release verifier
        run: python -m unittest scripts.test_verify_release -v

      - name: Audit tracked source
        run: python scripts/verify_release.py

      - name: Build source archive
        run: scripts/package-release.sh "/tmp/Homeworker-${GITHUB_REF_NAME}.zip"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          "/tmp/Homeworker-${GITHUB_REF_NAME}.zip"
          --repo "$GITHUB_REPOSITORY"
          --verify-tag
          --generate-notes
          --title "Homeworker ${GITHUB_REF_NAME}"
