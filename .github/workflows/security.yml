name: Security

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source:
    name: Dependencies, secrets, and configuration
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.0
        with:
          persist-credentials: false

      - name: Scan repository with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          format: table
          exit-code: "1"
          ignore-unfixed: false
          severity: HIGH,CRITICAL

      - name: Set up Python
        uses: actions/setup-python@v6.3.0
        with:
          python-version: 3.14.6

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.3.2
        with:
          version: 0.11.28
          enable-cache: true
          cache-dependency-glob: services/api/uv.lock

      - name: Audit locked Python dependencies
        run: |
          uv export --project services/api --frozen --no-dev --no-emit-project --format requirements-txt --output-file /tmp/homeworker-requirements.txt
          uvx --from pip-audit==2.10.1 pip-audit --strict --requirement /tmp/homeworker-requirements.txt

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.0.9
        with:
          version: 11.18.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24.18.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Audit locked production JavaScript dependencies
        run: pnpm audit --prod --audit-level high

  containers:
    name: Container vulnerabilities
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.0
        with:
          persist-credentials: false

      - name: Build core images
        run: docker compose -f infra/compose.yaml build

      - name: Scan API image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: homeworker-api:local
          scanners: vuln
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL

      - name: Scan web image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: homeworker-web:local
          scanners: vuln
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL
