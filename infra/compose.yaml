name: homeworker

services:
  api:
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.api
    image: ${INK_API_IMAGE:-homeworker-api:local}
    restart: unless-stopped
    init: true
    user: "10001:10001"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      INK_APP_ENV: ${INK_APP_ENV:-production}
      INK_RUNTIME_MODE: local
      INK_DATABASE_URL: sqlite:////data/homeworker.db
      INK_STORAGE_ROOT: /data/storage
      INK_WORK_ROOT: /tmp/homeworker
      INK_CORS_ORIGINS: ${INK_CORS_ORIGINS:-http://localhost:3000}
      INK_MAX_UPLOAD_BYTES: ${INK_MAX_UPLOAD_BYTES:-26214400}
      INK_MAX_PDF_PAGES: ${INK_MAX_PDF_PAGES:-100}
      INK_MAX_IMAGE_PIXELS: ${INK_MAX_IMAGE_PIXELS:-40000000}
      INK_MAX_EXTRACTED_CHARS_PER_PAGE: ${INK_MAX_EXTRACTED_CHARS_PER_PAGE:-2000000}
      INK_OCR_DPI: ${INK_OCR_DPI:-200}
      INK_OCR_TIMEOUT_SECONDS: ${INK_OCR_TIMEOUT_SECONDS:-30}
      INK_OCR_LANGUAGES: ${INK_OCR_LANGUAGES:-eng}
      INK_LOW_CONFIDENCE_THRESHOLD: ${INK_LOW_CONFIDENCE_THRESHOLD:-0.80}
      ANALYZER_PROVIDER: ${ANALYZER_PROVIDER:-rules}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:4b}
      OLLAMA_TIMEOUT_SECONDS: ${OLLAMA_TIMEOUT_SECONDS:-20}
      TZ: UTC
    volumes:
      - ink_data:/data
    tmpfs:
      - /tmp:size=${INK_API_TMPFS_SIZE:-1073741824},mode=1770,uid=10001,gid=10001
    networks:
      - ink_internal
    ports:
      - "127.0.0.1:${INK_API_PORT:-8000}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    stop_grace_period: 45s
    pids_limit: ${INK_API_PIDS_LIMIT:-256}
    cpus: ${INK_API_CPUS:-2.0}
    mem_limit: ${INK_API_MEMORY_LIMIT:-4g}
    mem_reservation: ${INK_API_MEMORY_RESERVATION:-512m}
    ulimits:
      nofile:
        soft: 4096
        hard: 4096

  web:
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.web
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
    image: ${INK_WEB_IMAGE:-homeworker-web:local}
    restart: unless-stopped
    init: true
    user: "10001:10001"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      HOSTNAME: 0.0.0.0
      PORT: "3000"
      NODE_ENV: production
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
      TZ: UTC
    tmpfs:
      - /tmp:size=67108864,mode=1770,uid=10001,gid=10001
      - /app/apps/web/.next/cache:size=134217728,mode=1770,uid=10001,gid=10001
    networks:
      - ink_internal
    ports:
      - "127.0.0.1:${INK_WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
        restart: true
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    stop_grace_period: 20s
    pids_limit: ${INK_WEB_PIDS_LIMIT:-128}
    cpus: ${INK_WEB_CPUS:-1.0}
    mem_limit: ${INK_WEB_MEMORY_LIMIT:-1g}
    mem_reservation: ${INK_WEB_MEMORY_RESERVATION:-256m}

  ollama:
    profiles:
      - ollama
    image: ${OLLAMA_IMAGE:-ollama/ollama:0.32.0}
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-5m}
      OLLAMA_MAX_LOADED_MODELS: ${OLLAMA_MAX_LOADED_MODELS:-1}
      OLLAMA_NUM_PARALLEL: ${OLLAMA_NUM_PARALLEL:-1}
    volumes:
      - ollama_data:/root/.ollama
    tmpfs:
      - /tmp:size=268435456,mode=1770
    networks:
      - ink_internal
      - ollama_egress
    expose:
      - "11434"
    healthcheck:
      test:
        - CMD
        - ollama
        - list
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 30s
    pids_limit: ${OLLAMA_PIDS_LIMIT:-512}
    cpus: ${OLLAMA_CPUS:-4.0}
    mem_limit: ${OLLAMA_MEMORY_LIMIT:-6g}
    mem_reservation: ${OLLAMA_MEMORY_RESERVATION:-2g}

volumes:
  ink_data:
    name: ${INK_DATA_VOLUME:-homeworker-data}
  ollama_data:
    name: ${OLLAMA_DATA_VOLUME:-homeworker-ollama}

networks:
  ink_internal:
    internal: true
  ollama_egress: {}
