services:
  - type: web
    name: homeworker-api
    runtime: docker
    plan: free
    dockerfilePath: ./infra/docker/Dockerfile.api
    dockerContext: .
    healthCheckPath: /ready
    autoDeployTrigger: commit
    envVars:
      # Only values that differ from Settings.from_env() defaults (or that must be
      # provided as secrets) belong here; the rest are documented in app/config.py.
      - key: INK_APP_ENV
        value: production
      - key: INK_RUNTIME_MODE
        value: hosted
      - key: INK_DATABASE_URL
        sync: false
      - key: INK_CORS_ORIGINS
        sync: false
      - key: INK_WORK_ROOT
        value: /tmp/homeworker
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: PORT
        value: "8000"
